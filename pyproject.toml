[project]
name = "rover-sim"
version = "0.1.0"
description = "Exploration rover simulator: a model-based agent on a 2D grid world"
readme = "README.md"
authors = [
    { name = "maksym", email = "maksym@email.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.3.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
rover-sim = "rover_sim.cli:app"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
